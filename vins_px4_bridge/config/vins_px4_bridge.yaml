# VINS-PX4 Bridge Configuration
# Place this file in your workspace and load via:
#   ros2 launch vins_px4_bridge vins_px4_bridge.launch.py

vins_px4_bridge:
  ros__parameters:
    # VINS odometry topic to subscribe
    odometry_topic: "/vins_estimator/odometry"

    # Body frame convention of the SLAM/odometry source
    #   'FLU' -> Forward-Left-Up  (VINS IMU body frame)
    #   'FRD' -> Forward-Right-Down (already PX4-aligned, skip body correction)
    body_frame: "FLU"

    # Yaw alignment mode
    #   'none'    -> no yaw correction; SLAM "North" = initialization heading
    #   'px4_mag' -> subscribe to /fmu/out/vehicle_attitude, align SLAM yaw to mag North
    #   'manual'  -> apply fixed manual_yaw_offset_rad
    yaw_alignment_mode: "none"
    manual_yaw_offset_rad: 0.0

    # Safety: position jump detection
    # If |p - p_prev| > threshold, increment reset_counter and re-lock yaw
    position_jump_threshold: 0.5

    # Default variances (used because VINS does not publish covariance)
    # Position variance [X, Y, Z] in m^2
    default_position_variance: [0.01, 0.01, 0.01]
    # Orientation variance [roll, pitch, yaw] in rad^2
    default_orientation_variance: [0.01, 0.01, 0.01]
    # Velocity variance [X, Y, Z] in (m/s)^2
    default_velocity_variance: [0.01, 0.01, 0.01]
